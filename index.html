<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Armador de Rutas - DPEC</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2b52">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Armador Rutas">
<style>
  :root {
    --bg: #121212;
    --bg-card: #1e1e1e;
    --bg-card2: #262626;
    --amber: #ffb300;
    --amber-dark: #cc8f00;
    --green: #4caf50;
    --red: #e53935;
    --blue: #42a5f5;
    --gray: #2f2f2f;
    --text: #f0f0f0;
    --text-dim: #9a9a9a;
    --border: #333;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    padding-bottom: 40px;
  }
  header {
    background: linear-gradient(135deg, #1a1a1a, #222);
    border-bottom: 3px solid var(--amber);
    padding: 14px 16px;
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .back {
    background: none; border: none; color: var(--amber);
    font-size: 20px; padding: 4px 6px 4px 0; display: none;
  }
  header .titles { flex: 1; text-align: center; }
  header h1 { margin: 0; font-size: 17px; color: var(--amber); letter-spacing: 0.3px; }
  header .sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .spacer24 { width: 24px; }
  .container { max-width: 560px; margin: 0 auto; padding: 14px; }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; margin-top: 12px; }
  label:first-child { margin-top: 0; }
  input[type="text"], input[type="number"], input[type="date"], select {
    width: 100%;
    background: var(--bg-card2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px;
    border-radius: 8px;
    font-size: 16px;
  }
  input:focus, select:focus { outline: none; border-color: var(--amber); }
  .btn-main {
    width: 100%; background: var(--amber); color: #1a1a1a; border: none;
    padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; margin-top: 14px;
  }
  .btn-main:active { background: var(--amber-dark); }
  .btn-main:disabled { background: var(--gray); color: var(--text-dim); }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn-sec {
    flex: 1; background: var(--bg-card2); color: var(--text); border: 1px solid var(--border);
    padding: 11px; border-radius: 8px; font-size: 14px;
  }
  .btn-sec.green { border-color: var(--green); color: var(--green); }
  .btn-sec.red { border-color: var(--red); color: var(--red); }
  .btn-sec.amber { border-color: var(--amber); color: var(--amber); }

  /* Home: lista de rutas */
  .route-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;
  }
  .route-card .info { flex: 1; }
  .route-card .rname { font-size: 16px; font-weight: bold; color: var(--amber); }
  .route-card .rmeta { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .route-card .rdelete { background: none; border: none; color: var(--red); font-size: 18px; padding: 6px 8px; }
  .firma-pie { margin: 26px 0 8px; text-align: center; font-size: 11px; color: var(--text-dim); opacity: 0.75; line-height: 1.6; }
  .firma-pie span { display: block; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: var(--text); opacity: 0.8; }
  .btn-lect { width: 100%; margin-bottom: 12px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
  .btn-lect b { color: var(--amber); }
  .btn-lect span { color: var(--text-dim); font-size: 12px; }
  .nombre-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.88); z-index: 900; display: flex; align-items: center; justify-content: center; padding: 18px; }
  .nombre-box { width: 100%; max-width: 420px; background: var(--bg-card); border: 2px solid var(--amber); border-radius: 14px; padding: 18px; }
  .nombre-box h2 { margin: 0 0 6px; font-size: 18px; color: var(--amber); }
  .nombre-box p { margin: 0 0 12px; font-size: 13px; color: var(--text-dim); }
  .firma-pie .ver { display: block; margin-top: 6px; font-size: 11px; font-weight: 400; letter-spacing: 0; color: var(--text-dim); opacity: 0.8; }
  .empty-state { text-align: center; color: var(--text-dim); padding: 30px 10px; font-size: 13px; }

  /* Tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab-btn {
    flex: 1; background: var(--bg-card2); border: 1px solid var(--border); color: var(--text-dim);
    padding: 10px; border-radius: 8px; font-size: 14px; font-weight: bold;
  }
  .tab-btn.active { background: var(--amber); color: #1a1a1a; border-color: var(--amber); }

  /* Calle card */
  .calle-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .calle-card.active { border-color: var(--amber); }
  .calle-head {
    padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    background: var(--bg-card2);
  }
  .calle-head .cname { font-size: 15px; font-weight: bold; }
  .calle-head .ccount { font-size: 12px; color: var(--text-dim); }
  .calle-head .reabrir { background: none; border: 1px solid var(--blue); color: var(--blue); border-radius: 6px; padding: 3px 9px; font-size: 12px; }
  .calle-body { padding: 10px 14px; }
  .med-row {
    display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .med-row:last-child { border-bottom: none; }
  .med-row .med-orden { font-size: 12px; color: var(--text-dim); width: 30px; flex-shrink: 0; }
  .med-row .med-info { flex: 1; font-size: 14px; }
  .med-row .med-info b { color: var(--amber); }
  .med-row .med-actions { display: flex; gap: 4px; }
  .med-row button {
    background: var(--gray); border: none; color: var(--text); width: 30px; height: 30px;
    border-radius: 6px; font-size: 13px;
  }
  .med-row button:disabled { opacity: 0.3; }
  .med-row button.del { color: var(--red); }
  .med-row button.foto { color: var(--text-dim); }
  .med-row button.foto.tiene { color: var(--green); }

  .foto-modal {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.92);
    z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px;
  }
  .foto-modal img { max-width: 100%; max-height: 75vh; border-radius: 8px; }
  .foto-modal .btn-row { width: 100%; max-width: 400px; }

  .scan-btn {
    background: var(--bg-card2); border: 1px solid var(--amber); color: var(--amber);
    border-radius: 8px; padding: 12px 14px; font-size: 14px; font-weight: bold; white-space: nowrap;
  }
  .scan-modal {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000;
    z-index: 110; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; gap: 14px;
  }
  .scan-modal video { width: 100%; max-width: 480px; max-height: 65vh; border-radius: 10px; background: #111; }
  .scan-hint { color: var(--amber); font-size: 15px; font-weight: bold; text-align: center; }
  .scan-wrap { position: relative; width: 100%; max-width: 480px; }
  .scan-wrap video { width: 100%; max-height: 52vh; border-radius: 10px; background: #111; display: block; }
  .scan-wrap .frame { position: absolute; left: 10%; right: 10%; top: 30%; bottom: 30%; border: 2px solid rgba(255,179,0,0.85); border-radius: 10px; pointer-events: none; }
  .scan-torch { position: absolute; right: 10px; top: 10px; width: 48px; height: 48px; border-radius: 50%; border: none; background: rgba(0,0,0,0.6); color: #fff; font-size: 22px; }
  .scan-torch.on { background: var(--amber); color: #1a1a1a; }
  .scan-zoom { width: 100%; max-width: 480px; display: flex; align-items: center; gap: 10px; color: var(--text-dim); font-size: 13px; }
  .scan-zoom input { flex: 1; accent-color: var(--amber); height: 30px; }
  .scan-res { width: 100%; max-width: 480px; background: var(--bg-card); border: 2px solid var(--amber); border-radius: 14px; padding: 14px; text-align: center; }
  .scan-res .lbl { font-size: 12px; color: var(--text-dim); }
  .scan-res .num { font-size: 34px; font-weight: 800; color: var(--amber); letter-spacing: 1px; word-break: break-all; margin: 4px 0 8px; }
  .scan-res .warn { background: rgba(229,57,53,0.15); border: 1px solid var(--red); color: #ff8a80; border-radius: 8px; padding: 8px; font-size: 13px; margin-bottom: 8px; }
  .scan-res .btn-row .btn-sec { padding: 15px; font-size: 16px; }
  .chk-cont { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; color: var(--text-dim); }
  .chk-cont input { width: 22px; height: 22px; accent-color: var(--amber); flex-shrink: 0; margin: 0; }

  /* Mapa */
  .map-card { padding: 0; overflow: hidden; position: relative; }
  .map-box { width: 100%; height: 300px; background: #1b2029; position: relative; }
  .ruta-mapa-box { width: 100%; height: 62vh; min-height: 340px; background: #1b2029; position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 14px; }
  .map-empty { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px 70px 24px 24px; color: var(--text-dim); font-size: 14px; z-index: 5; pointer-events: none; }
  .map-legend { position: absolute; left: 8px; bottom: 8px; z-index: 10; background: rgba(18,18,18,0.88); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; font-size: 12px; max-height: 55%; overflow-y: auto; }
  .map-legend div { display: flex; align-items: center; gap: 7px; padding: 2px 0; white-space: nowrap; }
  .map-legend i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .map-legend .sg { color: var(--text-dim); }
  .map-note { position: absolute; left: 8px; top: 8px; z-index: 10; background: rgba(18,18,18,0.88); border: 1px solid var(--red); color: #ff8a80; font-size: 12px; border-radius: 8px; padding: 5px 9px; max-width: 70%; }
  .map-attr { position: absolute; right: 4px; bottom: 2px; z-index: 10; font-size: 10px; color: #ddd; background: rgba(0,0,0,0.55); padding: 1px 5px; border-radius: 3px; display: none; }
  .map-ctrl { position: absolute; right: 8px; top: 8px; z-index: 10; display: flex; flex-direction: column; gap: 4px; }
  .map-ctrl button { width: 42px; height: 42px; border: 1px solid var(--border); background: rgba(30,30,30,0.95); color: var(--text); font-size: 22px; font-weight: bold; border-radius: 8px; padding: 0; }
  .map-ctrl button:active { background: var(--amber); color: #1a1a1a; }
  .route-card .circ { width: 34px; height: 34px; border-radius: 50%; color: #101010; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; margin-right: 12px; flex-shrink: 0; }

  #printArea { display: none; }
  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { display: block; position: absolute; top: 0; left: 0; width: 100%; }
    .print-title { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
    .print-sub { font-size: 12px; color: #555; margin-bottom: 16px; }
    .print-calle { font-size: 15px; font-weight: bold; margin-top: 18px; border-bottom: 1px solid #999; padding-bottom: 4px; }
    .print-med { margin: 10px 0; page-break-inside: avoid; }
    .print-med .print-med-title { font-size: 13px; font-weight: bold; }
    .print-med .print-med-sub { font-size: 11px; color: #555; }
    .print-med img { max-width: 320px; max-height: 240px; margin-top: 4px; border: 1px solid #ccc; }
  }

  .add-form { display: flex; gap: 8px; margin-top: 10px; align-items: flex-end; }
  .add-form .fld { flex: 1; }
  .add-form .fld label { margin: 0 0 4px 0; font-size: 11px; }
  .add-form button.add-btn {
    background: var(--green); color: #0d0d0d; border: none; border-radius: 8px;
    padding: 12px 16px; font-weight: bold; font-size: 14px; white-space: nowrap;
  }

  .inline-form { background: var(--bg-card2); border: 1px dashed var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; }

  /* Recorrido */
  .recorrido-item { display: flex; gap: 12px; padding: 6px 0; }
  .rline { display: flex; flex-direction: column; align-items: center; width: 20px; flex-shrink: 0; }
  .rdot { width: 12px; height: 12px; border-radius: 50%; background: var(--gray); flex-shrink: 0; }
  .rdot.inicio { background: var(--blue); box-shadow: 0 0 6px var(--blue); }
  .rdot.fin { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .rconn { width: 2px; flex: 1; background: var(--border); min-height: 16px; }
  .rinfo { flex: 1; padding-bottom: 6px; }
  .rinfo .rtag { font-size: 10px; color: var(--text-dim); letter-spacing: 0.5px; text-transform: uppercase; }
  .rinfo .rmain { font-size: 14px; }
  .rinfo .rmain b { color: var(--amber); }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--green); color: #0d0d0d; padding: 10px 20px; border-radius: 20px;
    font-size: 14px; font-weight: bold; opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 50;
  }
  .toast.show { opacity: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <button class="back" id="btnBack">&larr;</button>
  <div class="titles">
    <h1 id="headerTitle"><img src="icon-192.png" alt="" style="width:26px;height:26px;border-radius:6px;vertical-align:-6px;margin-right:6px;">Armador de Rutas</h1>
    <div class="sub" id="headerSub">DPEC - Prefacturaci&oacute;n</div>
  </div>
  <div class="spacer24"></div>
</header>

<div class="container">

  <!-- ===== PANTALLA HOME ===== -->
  <div id="screenHome">

    <button class="btn-sec btn-lect" id="btnLecturista"><div>&#128100; Lecturista: <b id="lecturistaNombre">-</b></div><span>cambiar</span></button>

    <div class="card" id="cardNuevaRuta">
      <button class="btn-main" id="btnMostrarNuevaRuta">&#10133; NUEVA RUTA</button>
      <div id="formNuevaRuta" class="hidden">
        <label for="numRuta">N&uacute;mero de ruta</label>
        <input type="text" id="numRuta" inputmode="numeric" placeholder="Ej: 163">
        <label for="fechaRuta">Fecha</label>
        <input type="date" id="fechaRuta">
        <label for="zonaRuta">Zona / barrio (opcional)</label>
        <input type="text" id="zonaRuta" placeholder="Ej: Zona Norte">
        <div class="btn-row">
          <button class="btn-sec" id="btnCancelarNuevaRuta">Cancelar</button>
          <button class="btn-sec green" id="btnCrearRuta">Crear ruta</button>
        </div>
      </div>
    </div>

    <div class="card map-card" id="mapCardHome"><div class="map-box" id="mapaHome"></div></div>

    <div id="listaRutas"></div>

    <div class="btn-row" id="homeExportRow" style="display:none;">
      <button class="btn-sec amber" id="btnExportTodas">&#128190; Exportar todas a Excel</button>
    </div>
  </div>

  <!-- ===== PANTALLA RUTA ===== -->
  <div id="screenRoute" class="hidden">

    <div class="tabs">
      <button class="tab-btn active" id="tabArmado">Armado</button>
      <button class="tab-btn" id="tabRecorrido">Recorrido</button>
      <button class="tab-btn" id="tabMapa">Mapa</button>
    </div>

    <div id="viewArmado">
      <div id="callesContainer"></div>

      <div id="formSiguienteCalle" class="inline-form hidden">
        <label for="nombreCalle">Nombre de la calle</label>
        <input type="text" id="nombreCalle" placeholder="Ej: Belgrano">
        <div class="btn-row">
          <button class="btn-sec" id="btnCancelarCalle">Cancelar</button>
          <button class="btn-sec green" id="btnIniciarCalle">Iniciar calle</button>
        </div>
      </div>

      <button class="btn-main" id="btnSiguienteCalle">&#10133; SIGUIENTE CALLE</button>
    </div>

    <div id="viewRecorrido" class="hidden">
      <div class="card" id="recorridoContainer"></div>
    </div>

    <div id="viewMapa" class="hidden">
      <div class="ruta-mapa-box" id="mapaRuta"></div>
    </div>

    <div class="btn-row">
      <button class="btn-sec green" id="btnGuardarRuta">&#128190; Guardar</button>
      <button class="btn-sec amber" id="btnExportRuta">&#128190; Exportar a Excel</button>
    </div>
    <div class="btn-row">
      <button class="btn-sec green" id="btnShareExcel">&#128228; Compartir Excel</button>
      <button class="btn-sec green" id="btnShareFotos">&#128228; Compartir con fotos</button>
    </div>
    <div class="btn-row">
      <button class="btn-sec" id="btnExportPdf">&#128196; Exportar PDF (con fotos)</button>
      <button class="btn-sec red" id="btnEliminarRuta">Eliminar ruta</button>
    </div>
  </div>

</div>

<div class="firma-pie"><span>&lt;&nbsp;PQG&nbsp;&gt;</span>Desarrollado por Pablo Gabriel Quintana Godoy<span class="ver" id="verApp"></span></div>

<div class="nombre-modal hidden" id="modalNombre">
  <div class="nombre-box">
    <h2>&#128100; Nombre del lecturista</h2>
    <p id="nombreAyuda">Escrib&iacute; tu nombre y apellido. Se guarda en este celular y sale en el Excel y en las fotos.</p>
    <input type="text" id="inpNombre" placeholder="Ej: Juan P&eacute;rez" autocomplete="off">
    <div class="btn-row">
      <button class="btn-sec hidden" id="btnNombreCancelar">Cancelar</button>
      <button class="btn-sec green" id="btnNombreGuardar">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">Guardado &#10003;</div>

<input type="file" accept="image/*" capture="environment" id="inpFotoFile" class="hidden">

<div class="foto-modal hidden" id="fotoModal">
  <img id="fotoModalImg" alt="Foto del medidor">
  <div class="btn-row">
    <button class="btn-sec" id="btnCerrarFoto">Cerrar</button>
    <button class="btn-sec red" id="btnEliminarFoto">Eliminar foto</button>
  </div>
</div>

<div class="scan-modal hidden" id="scanModal">
  <div class="scan-hint" id="scanHint">Apunt&aacute; al c&oacute;digo de barras del medidor</div>
  <div class="scan-wrap">
    <video id="scanVideo" playsinline muted autoplay></video>
    <div class="frame"></div>
    <button class="scan-torch hidden" id="btnTorch" aria-label="Linterna">&#128294;</button>
  </div>
  <div class="scan-zoom hidden" id="scanZoomBox"><span>&#128269;</span><input type="range" id="scanZoom" min="1" max="2" step="0.1" value="1"></div>
  <div class="scan-res hidden" id="scanResultado">
    <div class="lbl">N&uacute;mero le&iacute;do</div>
    <div class="num" id="scanResNum"></div>
    <div class="warn hidden" id="scanResWarn"></div>
    <div class="btn-row">
      <button class="btn-sec" id="btnScanOtra">&#8635; Repetir</button>
      <button class="btn-sec green" id="btnScanUsar">&#10003; Usar</button>
    </div>
  </div>
  <div class="btn-row" id="scanBotones" style="width:100%;max-width:400px;">
    <button class="btn-sec" id="btnCerrarScan">Cancelar</button>
  </div>
</div>

<div id="printArea"></div>

<script>
(function () {
  var APP_VERSION = '14';   // mantener igual que CACHE_NAME en sw.js
  var STORAGE_KEY = 'dpec_armador_rutas_v1';
  var NOMBRE_KEY = 'dpec_armador_lecturista';
  function getLecturista() { try { return (localStorage.getItem(NOMBRE_KEY) || '').trim(); } catch (e) { return ''; } }
  function setLecturista(n) { try { localStorage.setItem(NOMBRE_KEY, String(n || '').trim()); } catch (e) {} }
  function limpioCsv(t) { return String(t == null ? '' : t).replace(/[;\r\n]+/g, ' ').trim(); }
  function lecturistaDe(route) { return (route && route.lecturista) ? route.lecturista : getLecturista(); }
  var SESSION_KEY = 'dpec_armador_rutas_session_v1';
  var currentGps = null;
  var currentRouteId = null;
  var currentTab = 'armado';

  function saveSession() {
    if (currentRouteId) {
      localStorage.setItem(SESSION_KEY, JSON.stringify({ routeId: currentRouteId, tab: currentTab }));
    } else {
      localStorage.removeItem(SESSION_KEY);
    }
  }
  function loadSession() {
    try {
      var raw = localStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  // ---------- persistencia ----------
  function loadRoutes() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveRoutes(routes) { localStorage.setItem(STORAGE_KEY, JSON.stringify(routes)); }
  function getRoute(id) {
    var routes = loadRoutes();
    for (var i = 0; i < routes.length; i++) { if (routes[i].id === id) return routes[i]; }
    return null;
  }
  function updateRoute(route) {
    var routes = loadRoutes();
    for (var i = 0; i < routes.length; i++) {
      if (routes[i].id === route.id) { routes[i] = route; break; }
    }
    saveRoutes(routes);
  }

  // ---------- fotos (IndexedDB, separado del localStorage) ----------
  var dbPromise = null;
  function openDb() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      var req = indexedDB.open('dpec_armador_rutas_fotos', 1);
      req.onupgradeneeded = function (e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains('fotos')) db.createObjectStore('fotos');
      };
      req.onsuccess = function (e) { resolve(e.target.result); };
      req.onerror = function (e) { reject(e); };
    });
    return dbPromise;
  }
  function guardarFoto(id, dataUrl) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('fotos', 'readwrite');
        tx.objectStore('fotos').put(dataUrl, id);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function (e) { reject(e); };
      });
    });
  }
  function obtenerFoto(id) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('fotos', 'readonly');
        var req = tx.objectStore('fotos').get(id);
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function (e) { reject(e); };
      });
    });
  }
  function eliminarFoto(id) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('fotos', 'readwrite');
        tx.objectStore('fotos').delete(id);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function (e) { reject(e); };
      });
    }).catch(function () {});
  }
  // Sello (marca de agua) con los datos del medidor, escrito sobre la foto
  function dibujarSello(ctx, w, h, lineas) {
    if (!lineas || !lineas.length) return;
    var fs = Math.max(13, Math.round(w / 30));
    var pad = Math.round(fs * 0.5);
    var alto = lineas.length * Math.round(fs * 1.28) + pad * 2 - Math.round(fs * 0.2);
    ctx.fillStyle = 'rgba(0,0,0,0.58)';
    ctx.fillRect(0, h - alto, w, alto);
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    for (var i = 0; i < lineas.length; i++) {
      ctx.font = (i === 0 ? 'bold ' : '') + fs + 'px sans-serif';
      ctx.fillStyle = i === 0 ? '#ffd54f' : '#ffffff';
      ctx.fillText(lineas[i], pad, h - alto + pad + i * Math.round(fs * 1.28), w - pad * 2);
    }
  }

  function dibujarFirmaFoto(ctx, w, h) {
    if (!imgFirma.complete || !imgFirma.naturalWidth) return;
    var ancho = Math.round(w * 0.085);
    var alto = Math.round(ancho * imgFirma.naturalHeight / imgFirma.naturalWidth);
    var mg = Math.round(w * 0.03);
    ctx.save();
    ctx.globalAlpha = 0.34;
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = Math.max(2, Math.round(ancho * 0.03));
    ctx.drawImage(imgFirma, w - mg - ancho, mg, ancho, alto);
    ctx.restore();
  }
  function datosSello(route, medId) {
    for (var i = 0; i < route.calles.length; i++) {
      var meds = route.calles[i].medidores;
      for (var j = 0; j < meds.length; j++) {
        if (meds[j].id !== medId) continue;
        var m = meds[j], d = new Date();
        var la = parseFloat(m.lat), lo = parseFloat(m.lon);
        var gps = (!isNaN(la) && !isNaN(lo)) ? la.toFixed(5) + ', ' + lo.toFixed(5) : 'sin ubicaci\u00f3n';
        return [
          'RUTA ' + route.numero + ' \u2022 ' + route.calles[i].nombre + (m.altura ? ' ' + m.altura : ''),
          'Medidor N\u00b0 ' + m.numMedidor + ' \u2022 Orden ' + pad3(ordenGlobalDe(route, i, j)),
          pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' \u2022 ' + gps
        ].concat(lecturistaDe(route) ? ['Lecturista: ' + lecturistaDe(route)] : []);
      }
    }
    return null;
  }
  function comprimirFoto(file, callback, lineas) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var maxDim = 700;
        var w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
        else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var cx = canvas.getContext('2d');
        cx.drawImage(img, 0, 0, w, h);
        dibujarSello(cx, w, h, lineas);
        dibujarFirmaFoto(cx, w, h);
        callback(canvas.toDataURL('image/jpeg', 0.5));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
  function findMedidorById(route, medId) {
    for (var i = 0; i < route.calles.length; i++) {
      var meds = route.calles[i].medidores;
      for (var j = 0; j < meds.length; j++) { if (meds[j].id === medId) return meds[j]; }
    }
    return null;
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function pad3(n) { var s = '' + n; while (s.length < 3) s = '0' + s; return s; }
  function uid(prefix) { return prefix + '_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5); }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function fmtFecha(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  function totalMedidores(route) {
    var t = 0;
    for (var i = 0; i < route.calles.length; i++) t += route.calles[i].medidores.length;
    return t;
  }
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function showToast(msg) {

  // ---------- GPS silencioso ----------
  function startGpsWatch() {
    if (!navigator.geolocation) return;
    navigator.geolocation.watchPosition(
      function (pos) {
        currentGps = { lat: pos.coords.latitude, lon: pos.coords.longitude, acc: Math.round(pos.coords.accuracy), t: Date.now() };
      },
      function () { /* silencioso: si falla, se reintenta al agregar cada medidor */ },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 8000 }
    );
  }

  // Devuelve una ubicaci\u00f3n actual: usa la del seguimiento si tiene menos de 15 s,
  // si no pide una nueva (hasta 7 s) y si no llega usa la \u00faltima que tenga.
  var GPS_FRESCO_MS = 15000;
  function getGps(callback) {
    if (currentGps && (Date.now() - currentGps.t) < GPS_FRESCO_MS) { callback(currentGps); return; }
    if (!navigator.geolocation) { callback(currentGps); return; }
    var terminado = false;
    function fin(g) { if (terminado) return; terminado = true; callback(g); }
    var timer = setTimeout(function () { fin(currentGps); }, 7000);
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        clearTimeout(timer);
        currentGps = { lat: pos.coords.latitude, lon: pos.coords.longitude, acc: Math.round(pos.coords.accuracy), t: Date.now() };
        fin(currentGps);
      },
      function () { clearTimeout(timer); fin(currentGps); },
      { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 }
    );
  }

  // ================= HOME =================
  // ================= MAPA (propio, sin librerias; funciona sin Internet) =================
  // Sin Internet: puntos y lineas de las rutas sobre fondo liso.
  // Con Internet: se agrega el mapa de calles (OpenStreetMap) de fondo.
  var COLORES = ['#4caf50', '#42a5f5', '#ab47bc', '#ffb300', '#ef5350', '#26c6da', '#ec407a', '#7e8ce0', '#9ccc65', '#ff7043', '#26a69a', '#d4e157'];

  function puntosDeRuta(route) {
    var pts = [], orden = 0, sin = 0;
    for (var i = 0; i < route.calles.length; i++) {
      for (var j = 0; j < route.calles[i].medidores.length; j++) {
        orden++;
        var m = route.calles[i].medidores[j];
        var la = parseFloat(m.lat), lo = parseFloat(m.lon);
        if (!isNaN(la) && !isNaN(lo)) pts.push({ lat: la, lon: lo, n: orden, med: m.numMedidor, calle: route.calles[i].nombre });
        else sin++;
      }
    }
    return { pts: pts, sin: sin };
  }

  function compartirImagenMapa(blob, nombre, titulo) {
    var file = new File([blob], nombre, { type: 'image/png' });
    if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: titulo, text: titulo }).catch(function (err) {
        if (err && err.name === 'AbortError') return;
        alert('No se pudo compartir: ' + (err && err.message ? err.message : err));
      });
    } else {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = nombre;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      alert('Este navegador no permite compartir directo. Se descargó la imagen del mapa en Descargas.');
    }
  }

  function crearMapa(contenedor, opciones) {
    var canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block;';
    contenedor.appendChild(canvas);
    var ctx = canvas.getContext('2d');

    var vacio = document.createElement('div');
    vacio.className = 'map-empty';
    vacio.textContent = opciones.textoVacio || 'Todav\u00eda no hay ubicaciones para mostrar.';
    contenedor.appendChild(vacio);

    var leyenda = null;
    if (opciones.leyenda) { leyenda = document.createElement('div'); leyenda.className = 'map-legend'; contenedor.appendChild(leyenda); }
    var nota = document.createElement('div'); nota.className = 'map-note hidden'; contenedor.appendChild(nota);
    var attr = document.createElement('div'); attr.className = 'map-attr'; attr.textContent = '\u00a9 OpenStreetMap'; contenedor.appendChild(attr);

    var caja = document.createElement('div'); caja.className = 'map-ctrl';
    function mkBtn(txt, titulo) { var b = document.createElement('button'); b.textContent = txt; b.title = titulo; return b; }
    var bMas = mkBtn('+', 'Acercar'), bMenos = mkBtn('\u2212', 'Alejar'), bAj = mkBtn('\u25a3', 'Ver todo'), bYo = mkBtn('\u2316', 'Mi ubicaci\u00f3n'), bSh = mkBtn('\uD83D\uDCE4', 'Compartir mapa');
    bSh.style.fontSize = '18px';
    caja.appendChild(bMas); caja.appendChild(bMenos); caja.appendChild(bAj); caja.appendChild(bYo); caja.appendChild(bSh);
    contenedor.appendChild(caja);

    var W = 300, H = 300, dpr = 1;
    var lat0 = -27.47, lon0 = -58.83, z = 14;
    var capas = [], pins = [], tiles = {}, nTiles = 0, yo = null, pendiente = false, sinTiles = false;

    function mx(lon, zz) { return (lon + 180) / 360 * 256 * Math.pow(2, zz); }
    function my(lat, zz) { var s = Math.sin(lat * Math.PI / 180); return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * 256 * Math.pow(2, zz); }
    function lonDe(x, zz) { return x / (256 * Math.pow(2, zz)) * 360 - 180; }
    function latDe(y, zz) { var n = Math.PI - 2 * Math.PI * y / (256 * Math.pow(2, zz)); return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))); }
    function aPant(lat, lon) { return { x: W / 2 + (mx(lon, z) - mx(lon0, z)), y: H / 2 + (my(lat, z) - my(lat0, z)) }; }
    function pedir() {
      if (pendiente) return;
      pendiente = true;
      (window.requestAnimationFrame || function (f) { setTimeout(f, 16); })(function () { pendiente = false; dibujar(); });
    }
    function medir() {
      var w = contenedor.clientWidth, h = contenedor.clientHeight;
      if (!w || !h) return false;
      dpr = window.devicePixelRatio || 1; W = w; H = h;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      return true;
    }

    function tile(tz, tx, ty) {
      var key = tz + '/' + tx + '/' + ty, t = tiles[key];
      if (t) return t;
      if (nTiles > 250) { tiles = {}; nTiles = 0; }
      var img = new Image(); t = { img: img, ok: false };
      img.crossOrigin = 'anonymous';
      img.onload = function () { t.ok = true; pedir(); };
      img.src = 'https://tile.openstreetmap.org/' + key + '.png';
      tiles[key] = t; nTiles++;
      return t;
    }

    function fondo() {
      ctx.fillStyle = '#1b2029'; ctx.fillRect(0, 0, W, H);
      var conTiles = false;
      if (navigator.onLine && !sinTiles) {
        var tz = Math.max(1, Math.min(19, Math.round(z)));
        var esc = Math.pow(2, z - tz), cx = mx(lon0, tz), cy = my(lat0, tz);
        var x0 = cx - (W / 2) / esc, y0 = cy - (H / 2) / esc;
        var tx0 = Math.floor(x0 / 256), ty0 = Math.floor(y0 / 256);
        var tx1 = Math.floor((cx + (W / 2) / esc) / 256), ty1 = Math.floor((cy + (H / 2) / esc) / 256);
        var max = Math.pow(2, tz);
        if ((tx1 - tx0 + 1) * (ty1 - ty0 + 1) <= 60) {
          for (var tx = tx0; tx <= tx1; tx++) {
            for (var ty = ty0; ty <= ty1; ty++) {
              if (ty < 0 || ty >= max) continue;
              var t = tile(tz, ((tx % max) + max) % max, ty);
              if (t.ok) { ctx.drawImage(t.img, (tx * 256 - x0) * esc, (ty * 256 - y0) * esc, 256 * esc + 0.5, 256 * esc + 0.5); conTiles = true; }
            }
          }
          if (conTiles) { ctx.fillStyle = 'rgba(10,14,22,0.35)'; ctx.fillRect(0, 0, W, H); }
        }
      }
      attr.style.display = conTiles ? 'block' : 'none';
      if (!conTiles) {
        ctx.strokeStyle = '#262d3a'; ctx.lineWidth = 1;
        var paso = 60, ox = (W / 2 - mx(lon0, z)) % paso, oy = (H / 2 - my(lat0, z)) % paso;
        ctx.beginPath();
        for (var gx = ox; gx < W; gx += paso) { ctx.moveTo(gx, 0); ctx.lineTo(gx, H); }
        for (var gy = oy; gy < H; gy += paso) { ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
        ctx.stroke();
      }
    }

    function pin(x, y, r, color, texto, info) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
      ctx.lineWidth = Math.max(2, r / 7); ctx.strokeStyle = '#ffffff'; ctx.stroke();
      if (texto) {
        ctx.fillStyle = '#101010'; ctx.font = 'bold ' + Math.round(r * 0.95) + 'px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(texto, x, y + 1);
      }
      if (info) pins.push({ x: x, y: y, r: Math.max(r, 20), info: info });
    }
    function flecha(a, b, color) {
      var dx = b.x - a.x, dy = b.y - a.y;
      if (Math.sqrt(dx * dx + dy * dy) < 40) return;
      ctx.save(); ctx.translate((a.x + b.x) / 2, (a.y + b.y) / 2); ctx.rotate(Math.atan2(dy, dx));
      ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-5, -5.5); ctx.lineTo(-5, 5.5); ctx.closePath();
      ctx.fillStyle = color; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#fff'; ctx.stroke(); ctx.restore();
    }

    function dibujar() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      pins = [];
      fondo();
      var i, j, c, ps;
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      var traz = [];
      for (i = 0; i < capas.length; i++) {
        c = capas[i]; ps = [];
        for (j = 0; j < c.pts.length; j++) ps.push(aPant(c.pts[j].lat, c.pts[j].lon));
        traz.push(ps);
        ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.beginPath();
        for (j = 0; j < ps.length; j++) { if (j === 0) ctx.moveTo(ps[j].x, ps[j].y); else ctx.lineTo(ps[j].x, ps[j].y); }
        ctx.stroke();
        ctx.lineWidth = 3.5; ctx.strokeStyle = c.color; ctx.beginPath();
        for (j = 0; j < ps.length; j++) { if (j === 0) ctx.moveTo(ps[j].x, ps[j].y); else ctx.lineTo(ps[j].x, ps[j].y); }
        ctx.stroke();
        if (c.modo === 'detalle') for (j = 1; j < ps.length; j++) flecha(ps[j - 1], ps[j], c.color);
      }
      for (i = 0; i < capas.length; i++) {
        c = capas[i]; ps = traz[i];
        if (c.modo === 'resumen') {
          for (j = 0; j < ps.length; j++) pin(ps[j].x, ps[j].y, 4, c.color, '', null);
          pin(ps[0].x, ps[0].y, 16, c.color, c.label, { capa: c });
        } else {
          var chico = ps.length > 60;
          for (j = 0; j < ps.length; j++) {
            var ini = (j === 0), fin = (j === ps.length - 1);
            var col = ini ? '#4caf50' : (fin ? '#ef5350' : c.color);
            var r = (ini || fin) ? 15 : (chico ? 8 : 13);
            pin(ps[j].x, ps[j].y, r, col, (chico && !ini && !fin) ? '' : String(c.pts[j].n), { capa: c, pt: c.pts[j] });
          }
        }
      }
      if (yo) {
        var yp = aPant(yo.lat, yo.lon);
        ctx.beginPath(); ctx.arc(yp.x, yp.y, 15, 0, Math.PI * 2); ctx.fillStyle = 'rgba(66,165,245,0.28)'; ctx.fill();
        ctx.beginPath(); ctx.arc(yp.x, yp.y, 8, 0, Math.PI * 2); ctx.fillStyle = '#42a5f5'; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
      }
    }

    function ajustar() {
      var pts = [], i, j;
      for (i = 0; i < capas.length; i++) for (j = 0; j < capas[i].pts.length; j++) pts.push(capas[i].pts[j]);
      if (!pts.length && yo) pts.push(yo);
      if (!pts.length) { pedir(); return; }
      var a = 90, b = -90, c0 = 180, d0 = -180;
      for (i = 0; i < pts.length; i++) {
        if (pts[i].lat < a) a = pts[i].lat; if (pts[i].lat > b) b = pts[i].lat;
        if (pts[i].lon < c0) c0 = pts[i].lon; if (pts[i].lon > d0) d0 = pts[i].lon;
      }
      var sx = mx(d0, 0) - mx(c0, 0), sy = my(a, 0) - my(b, 0), pad = 100;
      var zx = sx > 0 ? Math.log((W - pad) / sx) / Math.LN2 : 18;
      var zy = sy > 0 ? Math.log((H - pad) / sy) / Math.LN2 : 18;
      z = Math.max(3, Math.min(18, Math.min(zx, zy)));
      if (sx === 0 && sy === 0) z = 17;
      lon0 = lonDe((mx(c0, 0) + mx(d0, 0)) / 2, 0); lat0 = latDe((my(a, 0) + my(b, 0)) / 2, 0);
      pedir();
    }
    // ---- exportar el mapa como imagen (con título y marcas) ----
    function armarImagen(forzarSinTiles) {
      var info = opciones.infoExport ? opciones.infoExport() : { titulo: '', sub: '' };
      var esc = 2, banda = 74;
      var tmp = document.createElement('canvas');
      tmp.width = Math.round(W * esc); tmp.height = Math.round(H * esc);
      var ctxMain = ctx, dprMain = dpr, sinMain = sinTiles;
      ctx = tmp.getContext('2d'); dpr = esc; sinTiles = !!forzarSinTiles;
      try { dibujar(); } finally { ctx = ctxMain; dpr = dprMain; sinTiles = sinMain; }
      var conTilesImg = attr.style.display === 'block';
      var off = document.createElement('canvas');
      off.width = tmp.width; off.height = tmp.height + banda * esc;
      var o = off.getContext('2d');
      o.fillStyle = '#0f2b52'; o.fillRect(0, 0, off.width, banda * esc);
      o.textBaseline = 'top'; o.textAlign = 'left';
      o.fillStyle = '#ffffff'; o.font = 'bold ' + (24 * esc) + 'px sans-serif';
      o.fillText(info.titulo || '', 16 * esc, 12 * esc, off.width - 32 * esc);
      o.fillStyle = '#b4cdf0'; o.font = (15 * esc) + 'px sans-serif';
      o.fillText(info.sub || '', 16 * esc, 46 * esc, off.width - 32 * esc);
      o.drawImage(tmp, 0, banda * esc);
      // referencias abajo a la izquierda
      var items = [];
      if (opciones.leyenda) { for (var i = 0; i < capas.length && i < 12; i++) items.push({ c: capas[i].color, t: capas[i].label + ' = ' + capas[i].nombre }); }
      else { items.push({ c: '#4caf50', t: 'Inicio' }); items.push({ c: '#ef5350', t: 'Fin' }); items.push({ c: capas.length ? capas[0].color : '#ffb300', t: 'Medidores en orden' }); }
      if (items.length) {
        var lh = 22 * esc, pw = 0;
        o.font = (14 * esc) + 'px sans-serif';
        for (var k = 0; k < items.length; k++) pw = Math.max(pw, o.measureText(items[k].t).width);
        var bw = pw + 40 * esc, bh = items.length * lh + 12 * esc;
        var bx = 10 * esc, by = off.height - bh - 10 * esc - (conTilesImg ? 14 * esc : 0);
        o.fillStyle = 'rgba(15,28,45,0.85)'; o.fillRect(bx, by, bw, bh);
        for (var m2 = 0; m2 < items.length; m2++) {
          o.beginPath(); o.arc(bx + 14 * esc, by + 6 * esc + m2 * lh + lh / 2, 6 * esc, 0, Math.PI * 2); o.fillStyle = items[m2].c; o.fill();
          o.fillStyle = '#ffffff'; o.textBaseline = 'middle'; o.fillText(items[m2].t, bx + 28 * esc, by + 6 * esc + m2 * lh + lh / 2);
        }
      }
      if (conTilesImg) { o.fillStyle = 'rgba(255,255,255,0.8)'; o.textBaseline = 'alphabetic'; o.textAlign = 'right'; o.font = (11 * esc) + 'px sans-serif'; o.fillText('© OpenStreetMap', off.width - 8 * esc, off.height - 6 * esc); }
      return off;
    }
    function exportar(listo) {
      if (!capas.length) { listo(null); return; }
      var blob = null;
      function terminar(b) { pedir(); listo(b); }
      try {
        armarImagen(false).toBlob(function (b) { terminar(b); }, 'image/png');
      } catch (e) {
        // el fondo de calles impidió exportar: se genera igual, sin fondo
        try { armarImagen(true).toBlob(function (b) { terminar(b); }, 'image/png'); } catch (e2) { terminar(null); }
      }
    }
    bSh.addEventListener('click', function () {
      if (!capas.length) { alert('Todavía no hay ubicaciones para compartir.'); return; }
      showToast('Generando imagen...');
      exportar(function (b) {
        if (!b) { alert('No se pudo generar la imagen del mapa.'); return; }
        var info = opciones.infoExport ? opciones.infoExport() : { titulo: 'Mapa', nombre: 'mapa' };
        compartirImagenMapa(b, (info.nombre || 'mapa') + '_' + stamp() + '.png', info.titulo || 'Mapa');
      });
    });

    function zoomA(nz) { z = Math.max(2, Math.min(19, nz)); pedir(); }
    bMas.addEventListener('click', function () { zoomA(z + 1); });
    bMenos.addEventListener('click', function () { zoomA(z - 1); });
    bAj.addEventListener('click', ajustar);
    bYo.addEventListener('click', function () {
      getGps(function (g) {
        if (!g) { alert('No se pudo obtener tu ubicaci\u00f3n. Revis\u00e1 que el GPS est\u00e9 activado.'); return; }
        yo = { lat: g.lat, lon: g.lon }; lat0 = g.lat; lon0 = g.lon; if (z < 15) z = 16; pedir();
      });
    });

    var pun = {}, cuenta = 0, distIni = 0, zIni = 0, tDown = 0, movido = 0;
    function rel(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    function dist2() { var k = Object.keys(pun), a = pun[k[0]], b = pun[k[1]]; return Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y)); }
    canvas.addEventListener('pointerdown', function (e) {
      try { canvas.setPointerCapture(e.pointerId); } catch (x) {}
      pun[e.pointerId] = rel(e); cuenta = Object.keys(pun).length;
      if (cuenta === 1) { tDown = Date.now(); movido = 0; }
      if (cuenta === 2) { distIni = dist2(); zIni = z; movido = 99; }
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!pun[e.pointerId]) return;
      var p = rel(e);
      if (cuenta === 1) {
        var dx = p.x - pun[e.pointerId].x, dy = p.y - pun[e.pointerId].y;
        movido += Math.abs(dx) + Math.abs(dy);
        lon0 = lonDe(mx(lon0, z) - dx, z); lat0 = latDe(my(lat0, z) - dy, z);
        pun[e.pointerId] = p; pedir();
      } else if (cuenta === 2) {
        pun[e.pointerId] = p;
        if (distIni > 0) { z = Math.max(2, Math.min(19, zIni + Math.log(dist2() / distIni) / Math.LN2)); pedir(); }
      }
    });
    function soltar(e) {
      if (!pun[e.pointerId]) return;
      var p = rel(e), uno = (cuenta === 1);
      delete pun[e.pointerId]; cuenta = Object.keys(pun).length;
      if (uno && movido < 10 && (Date.now() - tDown) < 500) {
        for (var i = pins.length - 1; i >= 0; i--) {
          var q = pins[i];
          if ((p.x - q.x) * (p.x - q.x) + (p.y - q.y) * (p.y - q.y) <= q.r * q.r) { opciones.onTap(q.info); return; }
        }
      }
    }
    canvas.addEventListener('pointerup', soltar);
    canvas.addEventListener('pointercancel', soltar);
    canvas.addEventListener('wheel', function (e) { e.preventDefault(); zoomA(z + (e.deltaY < 0 ? 0.5 : -0.5)); }, { passive: false });

    function setCapas(nuevas, textoNota) {
      capas = nuevas;
      vacio.style.display = nuevas.length ? 'none' : 'flex';
      if (leyenda) {
        var h = '';
        for (var i = 0; i < nuevas.length && i < 10; i++) h += '<div><i style="background:' + nuevas[i].color + '"></i>' + escapeHtml(nuevas[i].nombre) + '</div>';
        if (nuevas.length > 10) h += '<div class="sg">y ' + (nuevas.length - 10) + ' m\u00e1s</div>';
        leyenda.innerHTML = h;
        leyenda.style.display = nuevas.length ? 'block' : 'none';
      }
      if (textoNota) { nota.textContent = textoNota; nota.className = 'map-note'; } else { nota.className = 'map-note hidden'; }
      if (medir()) ajustar();
    }
    function redimensionar() { if (medir()) { ajustar(); } }

    medir();
    return { setCapas: setCapas, resize: redimensionar, redibujar: pedir };
  }

  var mapaHome = null, mapaRuta = null;

  function renderMapaHome(routes) {
    if (!mapaHome) {
      mapaHome = crearMapa(document.getElementById('mapaHome'), {
        leyenda: true,
        textoVacio: 'Cuando cargues medidores, las rutas aparecen ac\u00e1 con su color.',
        infoExport: function () {
          var rs = loadRoutes(), med = 0;
          for (var q = 0; q < rs.length; q++) med += totalMedidores(rs[q]);
          return { titulo: 'Armador de Ruta \u2014 Mapa de rutas', sub: rs.length + ' rutas \u2022 ' + med + ' medidores \u2022 ' + fmtFecha(todayISO()), nombre: 'mapa_rutas' };
        },
        onTap: function (info) { if (info && info.capa && info.capa.id) appAbrirRuta(info.capa.id); }
      });
    }
    var capas = [], sinRuta = 0;
    for (var i = 0; i < routes.length; i++) {
      var d = puntosDeRuta(routes[i]);
      if (!d.pts.length) { if (totalMedidores(routes[i]) > 0) sinRuta++; continue; }
      capas.push({ id: routes[i].id, color: COLORES[i % COLORES.length], label: String(i + 1), nombre: 'Ruta ' + routes[i].numero, pts: d.pts, modo: 'resumen' });
    }
    mapaHome.setCapas(capas, sinRuta ? (sinRuta + (sinRuta === 1 ? ' ruta sin ubicaciones' : ' rutas sin ubicaciones')) : '');

  function renderMapaRuta(route) {
    if (!mapaRuta) {
      mapaRuta = crearMapa(document.getElementById('mapaRuta'), {
        leyenda: false,

        infoExport: function () {

          if (!r) return { titulo: 'Mapa', sub: '', nombre: 'mapa' };
          return { titulo: 'RUTA ' + r.numero + ' \u2014 Mapa del recorrido', sub: fmtFecha(r.fecha) + (r.zona ? ' \u2022 ' + r.zona : '') + ' \u2022 ' + totalMedidores(r) + ' medidores' + (lecturistaDe(r) ? ' \u2022 ' + lecturistaDe(r) : ''), nombre: 'mapa_ruta_' + r.numero };
        },
        onTap: function (info) {

        }
      });

    var d = puntosDeRuta(route);
    mapaRuta.setCapas(d.pts.length ? [{ id: route.id, color: '#ffb300', label: '', nombre: 'Ruta ' + route.numero, pts: d.pts, modo: 'detalle' }] : [],
      d.sin ? (d.sin + (d.sin === 1 ? ' medidor sin ubicaci\u00f3n' : ' medidores sin ubicaci\u00f3n')) : '');

  function renderHome() {
    var routes = loadRoutes();
    var container = document.getElementById('listaRutas');
    document.getElementById('homeExportRow').style.display = routes.length ? 'flex' : 'none';
    renderMapaHome(routes);

    if (routes.length === 0) {
      container.innerHTML = '<div class="empty-state">A\u00fan no cargaste ninguna ruta.</div>';
      return;
    }
    var sorted = routes.slice().sort(function (a, b) { return b.createdTs - a.createdTs; });
    var html = '';
    for (var i = 0; i < sorted.length; i++) {
      var r = sorted[i];
      var ci = routes.indexOf(r);
      html += '<div class="route-card" onclick="appAbrirRuta(\'' + r.id + '\')">';
      html += '<div class="circ" style="background:' + COLORES[ci % COLORES.length] + '">' + (ci + 1) + '</div>';
      html += '<div class="info"><div class="rname">RUTA ' + escapeHtml(r.numero) + '</div>';

      html += '<button class="rdelete" onclick="event.stopPropagation(); appEliminarRuta(\'' + r.id + '\')">&#128465;</button>';

  }

  function limpiarFotosDeRuta(route) {
    for (var i = 0; i < route.calles.length; i++) {
      var meds = route.calles[i].medidores;
      for (var j = 0; j < meds.length; j++) { if (meds[j].tieneFoto) eliminarFoto(meds[j].id); }
    }
  }

  window.appEliminarRuta = function (id) {
    if (!confirm('\u00bfEliminar esta ruta y todos sus medidores cargados?')) return;
    var routes = loadRoutes();
    var filtered = [];
    for (var i = 0; i < routes.length; i++) {
      if (routes[i].id === id) limpiarFotosDeRuta(routes[i]);
      else filtered.push(routes[i]);
    }
    saveRoutes(filtered);
    renderHome();
  };

  function findActiveCalleIndex(route) {
    for (var i = 0; i < route.calles.length; i++) { if (!route.calles[i].cerrada) return i; }
    return -1;
  }

  function renderRoute() {
    var route = getRoute(currentRouteId);
    if (!route) { volverHome(); return; }

    document.getElementById('headerTitle').textContent = 'RUTA ' + route.numero + ' \u2014 ' + totalMedidores(route) + ' MEDIDORES';
    document.getElementById('headerSub').textContent = fmtFecha(route.fecha) + (route.zona ? ' \u2022 ' + route.zona : '');

    if (currentTab === 'armado') renderArmado(route);
    else if (currentTab === 'recorrido') renderRecorrido(route);
    else renderMapaRuta(route);
  }

  function ordenGlobalDe(route, calleIdx, medIdx) {
    var n = 0;
    for (var i = 0; i < calleIdx; i++) n += route.calles[i].medidores.length;
    return n + medIdx + 1;
  }

  function renderArmado(route) {

      html += '<div class="calle-body">';
      for (var j = 0; j < calle.medidores.length; j++) {
        var m = calle.medidores[j];

        html += '<div class="med-row"><div class="med-orden">' + pad3(og) + '</div>';
        html += '<div class="med-info"><b>' + escapeHtml(m.numMedidor) + '</b>' + (m.altura ? ' \u2014 altura ' + escapeHtml(m.altura) : '') + (!m.lat ? ' <span style="color:var(--red);font-size:11px;">\u00b7 sin ubicaci\u00f3n</span>' : '') + '</div>';
        html += '<div class="med-actions">';
        html += '<button class="foto' + (m.tieneFoto ? ' tiene' : '') + '" onclick="appFoto(\'' + m.id + '\',' + (m.tieneFoto ? 'true' : 'false') + ')">\uD83D\uDCF7</button>';
        if (isActive) {
          html += '<button onclick="appMover(\'' + calle.id + '\',' + j + ',-1)" ' + (j === 0 ? 'disabled' : '') + '>\u2b06\ufe0f</button>';
          html += '<button onclick="appMover(\'' + calle.id + '\',' + j + ',1)" ' + (j === calle.medidores.length - 1 ? 'disabled' : '') + '>\u2b07\ufe0f</button>';
          html += '<button class="del" onclick="appEliminarMedidor(\'' + calle.id + '\',' + j + ')">\u2715</button>';
        }
        html += '</div>';
        html += '</div>';
      }

      if (isActive) {
        html += '<div class="add-form">';
        html += '<div class="fld"><label>N\u00b0 Medidor</label><input type="text" inputmode="numeric" id="inpMedidor" placeholder="Ej: 45821"></div>';
        html += '<button class="scan-btn" onclick="appEscanear()">\ud83d\udcf7 Escanear</button>';
        html += '</div>';
        html += '<div class="add-form">';
        html += '<div class="fld"><label>Altura</label><input type="text" inputmode="numeric" id="inpAltura" placeholder="Ej: 1200"></div>';
        html += '<button class="add-btn" onclick="appAgregarMedidor(\'' + calle.id + '\')">AGREGAR</button>';
        html += '</div>';
        html += '<label class="chk-cont"><input type="checkbox" onchange="appSetContinuo(this.checked)"' + (getContinuo() ? ' checked' : '') + '> \uD83D\uDD01 Escaneo continuo: despu\u00e9s de agregar, abre la c\u00e1mara para el siguiente</label>';
        html += '<button class="btn-sec" style="margin-top:10px;width:100%;" onclick="appCerrarCalle(\'' + calle.id + '\')">\uD83D\uDD12 CERRAR CALLE</button>';
      }
      html += '</div></div>';
    }
    container.innerHTML = html;

    var showSiguiente = (activeIdx === -1);
    document.getElementById('btnSiguienteCalle').classList.toggle('hidden', !showSiguiente);
  }

  document.getElementById('btnSiguienteCalle').addEventListener('click', function () {
    document.getElementById('formSiguienteCalle').classList.remove('hidden');
    document.getElementById('btnSiguienteCalle').classList.add('hidden');
    document.getElementById('nombreCalle').focus();
  });
  document.getElementById('btnCancelarCalle').addEventListener('click', function () {

    document.getElementById('btnSiguienteCalle').classList.remove('hidden');
    document.getElementById('nombreCalle').value = '';
  });
  document.getElementById('btnIniciarCalle').addEventListener('click', function () {
    var nombre = document.getElementById('nombreCalle').value.trim();
    if (!nombre) { alert('Ingres\u00e1 el nombre de la calle.'); return; }
    var route = getRoute(currentRouteId);
    route.calles.push({ id: uid('calle'), nombre: nombre, cerrada: false, medidores: [] });
    updateRoute(route);

    document.getElementById('formSiguienteCalle').classList.add('hidden');

  function findCalle(route, calleId) {
    for (var i = 0; i < route.calles.length; i++) { if (route.calles[i].id === calleId) return route.calles[i]; }
    return null;
  }

  // ---------- aviso de medidor repetido ----------
  function normNum(x) {
    var n = String(x == null ? '' : x).trim().toLowerCase();
    if (/^\d+$/.test(n)) n = n.replace(/^0+(?=\d)/, '');
    return n;
  }
  function buscarDuplicado(num) {
    var objetivo = normNum(num);
    if (!objetivo) return null;
    var routes = loadRoutes(), otra = null;
    for (var r = 0; r < routes.length; r++) {
      var route = routes[r];
      var orden = 0;
      for (var i = 0; i < route.calles.length; i++) {
        for (var j = 0; j < route.calles[i].medidores.length; j++) {
          orden++;
          if (normNum(route.calles[i].medidores[j].numMedidor) === objetivo) {
            var hit = { numero: route.calles[i].medidores[j].numMedidor, ruta: route.numero, calle: route.calles[i].nombre, orden: orden, misma: route.id === currentRouteId };
            if (hit.misma) return hit;
            if (!otra) otra = hit;
          }
        }
      }
    }
    return otra;
  }
  function textoDuplicado(d) {
    return 'El medidor ' + d.numero + ' ya est\u00e1 cargado ' + (d.misma ? 'en esta ruta' : 'en la ruta ' + d.ruta) + ' (calle ' + d.calle + ', n.\u00b0 ' + pad3(d.orden) + ').';
  }

  // ---------- escaneo continuo ----------
  var CONT_KEY = 'dpec_armador_continuo';
  function getContinuo() { try { return localStorage.getItem(CONT_KEY) === '1'; } catch (e) { return false; } }
  window.appSetContinuo = function (v) { try { localStorage.setItem(CONT_KEY, v ? '1' : '0'); } catch (e) {} };
  var vinoDeScan = false;

  var scanGps = null;     // ubicaci\u00f3n tomada en el momento de leer el c\u00f3digo
  var scanGpsTs = 0;
  var agregando = false;

  window.appAgregarMedidor = function (calleId) {
    if (agregando) return;
    var numMedidor = document.getElementById('inpMedidor').value.trim();
    var altura = document.getElementById('inpAltura').value.trim();
    if (!numMedidor) { alert('Ingres\u00e1 el n\u00famero de medidor.'); return; }

    var dup = buscarDuplicado(numMedidor);
    if (dup && !confirm('\u26a0\ufe0f ' + textoDuplicado(dup) + '\n\n\u00bfAgregarlo igual?')) return;

    agregando = true;
    var btn = document.querySelector('.add-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'UBICANDO...'; }

    function guardar(gps) {
      var route = getRoute(currentRouteId);
      var calle = route ? findCalle(route, calleId) : null;
      agregando = false;
      if (!calle) { renderRoute(); return; }
      calle.medidores.push({
        id: uid('m'),
        numMedidor: numMedidor,
        altura: altura,
        lat: gps ? gps.lat : '',
        lon: gps ? gps.lon : '',
        acc: gps ? gps.acc : '',
        ts: Date.now()
      });
      updateRoute(route);
      scanGps = null;
      renderRoute();
      var inp = document.getElementById('inpMedidor');
      if (inp) inp.focus();
      showToast(gps ? 'Agregado \u2713' : 'Agregado (sin ubicaci\u00f3n)');
      var reabrir = vinoDeScan && getContinuo();
      vinoDeScan = false;
      if (reabrir) setTimeout(function () { window.appEscanear(); }, 350);
    }

    // Si se ley\u00f3 con la c\u00e1mara hace poco, se usa la ubicaci\u00f3n de ese momento.
    if (scanGps && (Date.now() - scanGpsTs) < 120000) guardar(scanGps);
    else getGps(guardar);
  };

  // ---------- Lector de códigos de barras (cámara, offline) ----------
  var scanStream = null;
  var scanTimer = null;
  var scanDetector = null;
  var scanTrack = null;
  var scanPendiente = '';
  var torchOn = false;
  var ultimaLectura = '', lecturasIguales = 0;

  function detenerScan() {
    if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
    if (scanStream) {
      var tracks = scanStream.getTracks();
      for (var i = 0; i < tracks.length; i++) tracks[i].stop();
      scanStream = null;
    }
    scanTrack = null; torchOn = false;
    var v = document.getElementById('scanVideo');
    if (v) v.srcObject = null;
    document.getElementById('btnTorch').classList.add('hidden');
    document.getElementById('btnTorch').classList.remove('on');
    document.getElementById('scanZoomBox').classList.add('hidden');
    ocultarResultadoScan();
    document.getElementById('scanModal').classList.add('hidden');
  }

  function ocultarResultadoScan() {
    document.getElementById('scanResultado').classList.add('hidden');
    document.getElementById('scanBotones').classList.remove('hidden');
    document.getElementById('scanHint').classList.remove('hidden');
  }

  function iniciarDeteccion() {
    var v = document.getElementById('scanVideo');
    ultimaLectura = ''; lecturasIguales = 0;
    var ocupado = false;
    if (scanTimer) clearInterval(scanTimer);
    scanTimer = setInterval(function () {
      if (ocupado || v.readyState < 2) return;
      ocupado = true;
      scanDetector.detect(v).then(function (codigos) {
        ocupado = false;
        if (!scanTimer) return;
        if (codigos && codigos.length) {
          var val = String(codigos[0].rawValue || '').trim();
          if (!val) return;
          // se pide la misma lectura 2 veces seguidas: evita n\u00fameros mal le\u00eddos
          if (val === ultimaLectura) lecturasIguales++; else { ultimaLectura = val; lecturasIguales = 1; }
          if (lecturasIguales >= 2) alSerLeido(val);
        } else { ultimaLectura = ''; lecturasIguales = 0; }
      }).catch(function () { ocupado = false; });
    }, 200);
  }

  // Al leer un c\u00f3digo se muestra el n\u00famero grande para confirmarlo
  function alSerLeido(valor) {
    valor = String(valor || '').trim();
    if (!valor) return;
    if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
    var v = document.getElementById('scanVideo');
    try { v.pause(); } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(120);
    scanPendiente = valor;
    document.getElementById('scanResNum').textContent = valor;
    var dup = buscarDuplicado(valor);
    var w = document.getElementById('scanResWarn');
    if (dup) { w.textContent = '\u26a0\ufe0f ' + textoDuplicado(dup); w.classList.remove('hidden'); }
    else { w.classList.add('hidden'); }
    document.getElementById('scanResultado').classList.remove('hidden');
    document.getElementById('scanBotones').classList.add('hidden');
    document.getElementById('scanHint').classList.add('hidden');
  }

  document.getElementById('btnScanUsar').addEventListener('click', function () {
    var valor = scanPendiente;
    detenerScan();
    if (!valor) return;
    var inp = document.getElementById('inpMedidor');
    if (inp) inp.value = valor;
    vinoDeScan = true;
    // ubicaci\u00f3n tomada en el momento de la lectura
    scanGps = null;
    getGps(function (g) { scanGps = g; scanGpsTs = Date.now(); });
    showToast('Le\u00eddo: ' + valor);
    var alt = document.getElementById('inpAltura');
    if (alt) alt.focus();
  });
  document.getElementById('btnScanOtra').addEventListener('click', function () {
    scanPendiente = '';
    ocultarResultadoScan();
    var v = document.getElementById('scanVideo');
    var p = v.play(); if (p && p.catch) p.catch(function () {});
    iniciarDeteccion();
  });

  // Linterna y zoom (si el celular los permite)
  function configurarControlesCamara(stream) {
    scanTrack = stream.getVideoTracks()[0] || null;
    var caps = {};
    try { caps = (scanTrack && scanTrack.getCapabilities) ? scanTrack.getCapabilities() : {}; } catch (e) { caps = {}; }
    var bT = document.getElementById('btnTorch');
    if (caps.torch) bT.classList.remove('hidden'); else bT.classList.add('hidden');
    var zb = document.getElementById('scanZoomBox'), zr = document.getElementById('scanZoom');
    if (caps.zoom && caps.zoom.max > caps.zoom.min) {
      var min = caps.zoom.min, max = min + (caps.zoom.max - min) * 0.7;   // tope al 70 %: evita que se trabe la c\u00e1mara
      zr.min = min; zr.max = max; zr.step = caps.zoom.step || 0.1; zr.value = min;
      zb.classList.remove('hidden');
    } else { zb.classList.add('hidden'); }
  }
  document.getElementById('btnTorch').addEventListener('click', function () {
    if (!scanTrack) return;
    torchOn = !torchOn;
    var b = document.getElementById('btnTorch');
    scanTrack.applyConstraints({ advanced: [{ torch: torchOn }] }).then(function () {
      b.classList.toggle('on', torchOn);
    }).catch(function () { torchOn = false; b.classList.remove('on'); });
  });
  var zoomTimer = null;
  document.getElementById('scanZoom').addEventListener('input', function (e) {
    var val = parseFloat(e.target.value);
    if (zoomTimer) return;
    zoomTimer = setTimeout(function () {
      zoomTimer = null;
      if (scanTrack) scanTrack.applyConstraints({ advanced: [{ zoom: val }] }).catch(function () {});
    }, 120);
  });

  window.appEscanear = function () {
    if (!('BarcodeDetector' in window) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('Este celular o navegador no tiene lector de c\u00f3digos. Carg\u00e1 el n\u00famero a mano.');
      return;
    }
    if (scanStream) return;   // ya est\u00e1 abierto
    var preferidos = ['code_128', 'code_39', 'code_93', 'codabar', 'ean_13', 'ean_8', 'itf', 'upc_a', 'upc_e', 'qr_code', 'data_matrix'];
    BarcodeDetector.getSupportedFormats().then(function (soportados) {
      var formatos = preferidos.filter(function (f) { return soportados.indexOf(f) !== -1; });
      scanDetector = formatos.length ? new BarcodeDetector({ formats: formatos }) : new BarcodeDetector();
      return navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
    }).then(function (stream) {
      scanStream = stream;
      var v = document.getElementById('scanVideo');
      v.srcObject = stream;
      ocultarResultadoScan();
      document.getElementById('scanModal').classList.remove('hidden');
      var p = v.play();
      if (p && p.catch) p.catch(function () {});
      configurarControlesCamara(stream);
      iniciarDeteccion();
    }).catch(function (err) {
      detenerScan();
      alert('No se pudo abrir la c\u00e1mara (' + (err && err.name ? err.name : 'error') + '). Revis\u00e1 el permiso de c\u00e1mara de la app.');
    });
  };

  document.getElementById('btnCerrarScan').addEventListener('click', detenerScan);
  document.addEventListener('visibilitychange', function () { if (document.hidden) detenerScan(); });

  // Enter: del n\u00famero pasa a la altura; en la altura agrega el medidor
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || !e.target || !e.target.id) return;
    if (e.target.id === 'inpMedidor') {
      e.preventDefault();
      var alt = document.getElementById('inpAltura'); if (alt) alt.focus();
    } else if (e.target.id === 'inpAltura') {
      e.preventDefault();
      var route = getRoute(currentRouteId);
      var idx = route ? findActiveCalleIndex(route) : -1;
      if (idx !== -1) window.appAgregarMedidor(route.calles[idx].id);
    }
  });

  window.appMover = function (calleId, idx, dir) {
    var route = getRoute(currentRouteId);
    var calle = findCalle(route, calleId);
    var newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= calle.medidores.length) return;
    var tmp = calle.medidores[idx];
    calle.medidores[idx] = calle.medidores[newIdx];
    calle.medidores[newIdx] = tmp;
    updateRoute(route);
    renderRoute();
  };

  window.appEliminarMedidor = function (calleId, idx) {
    var route = getRoute(currentRouteId);
    var calle = findCalle(route, calleId);
    var m = calle.medidores[idx];
    if (m && m.tieneFoto) eliminarFoto(m.id);
    calle.medidores.splice(idx, 1);
    updateRoute(route);
    renderRoute();
  };

  // ---------- fotos: tomar / ver / eliminar ----------
  var fotoPendienteId = null;

  window.appFoto = function (medId, tieneFoto) {
    if (tieneFoto) { appVerFoto(medId); return; }
    fotoPendienteId = medId;
    document.getElementById('inpFotoFile').click();
  };

  document.getElementById('inpFotoFile').addEventListener('change', function (e) {
    var file = e.target.files[0];
    var medId = fotoPendienteId;
    fotoPendienteId = null;
    e.target.value = '';
    if (!file || !medId) return;
    var rutaSello = getRoute(currentRouteId);
    var lineasSello = rutaSello ? datosSello(rutaSello, medId) : null;
    comprimirFoto(file, function (dataUrl) {
      guardarFoto(medId, dataUrl).then(function () {
        var route = getRoute(currentRouteId);

  window.appCerrarCalle = function (calleId) {

    if (calle.medidores.length === 0) {
      if (!confirm('Esta calle no tiene medidores cargados. \u00bfEliminarla?')) return;
      var idx = route.calles.indexOf(calle);
      route.calles.splice(idx, 1);

    if (activeIdx !== -1) { alert('Cerr\u00e1 primero la calle en curso antes de reabrir otra.'); return; }

  document.getElementById('btnEliminarRuta').addEventListener('click', function () {
    if (!confirm('\u00bfEliminar esta ruta completa?')) return;
    var routes = loadRoutes();
    var filtered = [];
    for (var i = 0; i < routes.length; i++) {
      if (routes[i].id === currentRouteId) limpiarFotosDeRuta(routes[i]);
      else filtered.push(routes[i]);

    saveRoutes(filtered);
    volverHome();

  // ---------- Recorrido ----------
  function renderRecorrido(route) {
    var container = document.getElementById('recorridoContainer');
    var flat = [];
    for (var i = 0; i < route.calles.length; i++) {
      var calle = route.calles[i];
      for (var j = 0; j < calle.medidores.length; j++) {
        flat.push({ calle: calle.nombre, m: calle.medidores[j] });
      }
    }
    if (flat.length === 0) {
      container.innerHTML = '<div class="empty-state">Todav\u00eda no hay medidores cargados en esta ruta.</div>';
      return;
    }
    var html = '';
    for (var k = 0; k < flat.length; k++) {
      var isFirst = (k === 0);
      var isLast = (k === flat.length - 1);
      var tag = isFirst ? '\uD83D\uDCCD INICIO' : (isLast ? '\uD83D\uDCCD FIN' : 'CONTORNO');
      var dotClass = isFirst ? 'inicio' : (isLast ? 'fin' : '');
      html += '<div class="recorrido-item">';
      html += '<div class="rline"><div class="rdot ' + dotClass + '"></div>' + (isLast ? '' : '<div class="rconn"></div>') + '</div>';
      html += '<div class="rinfo"><div class="rtag">' + tag + '</div>';
      html += '<div class="rmain"><b>' + escapeHtml(flat[k].calle) + '</b>' + (flat[k].m.altura ? ' ' + escapeHtml(flat[k].m.altura) : '') + ' \u2014 medidor ' + escapeHtml(flat[k].m.numMedidor) + '</div></div>';
      html += '</div>';
    }
    container.innerHTML = html;
  }

  document.getElementById('btnGuardarRuta').addEventListener('click', function () {

  document.getElementById('btnExportPdf').addEventListener('click', function () {
    var route = getRoute(currentRouteId);
    var medsConFoto = [];
    for (var i = 0; i < route.calles.length; i++) {
      var meds = route.calles[i].medidores;
      for (var j = 0; j < meds.length; j++) { if (meds[j].tieneFoto) medsConFoto.push(meds[j].id); }
    }
    var promesas = medsConFoto.map(function (id) {
      return obtenerFoto(id).then(function (dataUrl) { return { id: id, dataUrl: dataUrl }; }).catch(function () { return { id: id, dataUrl: null }; });
    });
    Promise.all(promesas).then(function (resultados) {
      var fotosPorId = {};
      resultados.forEach(function (r) { fotosPorId[r.id] = r.dataUrl; });
      renderPrintArea(route, fotosPorId);
      setTimeout(function () { window.print(); }, 150);
    });
  });

  function renderPrintArea(route, fotosPorId) {
    var html = '<div class="print-title">RUTA ' + escapeHtml(route.numero) + '</div>';
    html += '<div class="print-sub">' + fmtFecha(route.fecha) + (route.zona ? ' \u2022 ' + escapeHtml(route.zona) : '') + ' \u2022 ' + totalMedidores(route) + ' medidores' + (lecturistaDe(route) ? ' \u2022 Lecturista: ' + escapeHtml(lecturistaDe(route)) : '') + '</div>';
    for (var i = 0; i < route.calles.length; i++) {
      var calle = route.calles[i];
      html += '<div class="print-calle">\uD83D\uDEE3\uFE0F ' + escapeHtml(calle.nombre) + ' \u2014 ' + calle.medidores.length + ' medidores</div>';
      for (var j = 0; j < calle.medidores.length; j++) {
        var m = calle.medidores[j];
        var og = ordenGlobalDe(route, i, j);
        html += '<div class="print-med">';
        html += '<div class="print-med-title">' + pad3(og) + ' \u2014 Medidor ' + escapeHtml(m.numMedidor) + (m.altura ? ' \u2014 altura ' + escapeHtml(m.altura) : '') + '</div>';
        if (m.obs) html += '<div class="print-med-sub">' + escapeHtml(m.obs) + '</div>';
        if (m.tieneFoto && fotosPorId[m.id]) {
          html += '<img src="' + fotosPorId[m.id] + '" alt="Foto medidor ' + escapeHtml(m.numMedidor) + '">';
        }
        html += '</div>';
      }
    }
    document.getElementById('printArea').innerHTML = html;
  }

  // ---------- Export CSV ----------
  function buildCsv(routes) {
    var hasData = false;
    var rows = ['Ruta;Fecha;Zona;Orden Global;Calle;Orden en Calle;N\u00b0 Medidor;Altura;Foto;Latitud;Longitud;Precision GPS (m);Lecturista'];
    for (var r = 0; r < routes.length; r++) {
      var route = routes[r];
      var globalOrden = 0;
      for (var i = 0; i < route.calles.length; i++) {
        var calle = route.calles[i];
        for (var j = 0; j < calle.medidores.length; j++) {
          globalOrden++;
          hasData = true;
          var m = calle.medidores[j];
          var row = [
            route.numero, fmtFecha(route.fecha), route.zona || '',
            pad3(globalOrden), calle.nombre, pad3(j + 1),
            m.numMedidor, m.altura || '', (m.tieneFoto ? 'S\u00ed' : 'No'), m.lat || '', m.lon || '', m.acc || '', limpioCsv(lecturistaDe(route))
          ];
          rows.push(row.join(';'));
        }
      }
    }
    if (!hasData) return null;
    return '\uFEFF' + rows.join('\r\n');
  }

  function stamp() {
    var d = new Date();
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes());
  }

  function exportRoutesToCsv(routes, fileBase) {
    var csv = buildCsv(routes);
    if (!csv) { alert('No hay medidores cargados para exportar.'); return; }
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fileBase + '_' + stamp() + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  // ---------- Compartir (WhatsApp, mail, Drive...) ----------
  function dataUrlToFile(dataUrl, name) {
    var parts = dataUrl.split(',');
    var bin = atob(parts[1]);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new File([arr], name, { type: 'image/jpeg' });
  }

  function compartirRuta(conFotos) {
    var route = getRoute(currentRouteId);
    var csv = buildCsv([route]);
    if (!csv) { alert('No hay medidores cargados para compartir.'); return; }
    var base = 'ruta_' + route.numero + '_' + stamp();
    var files = [new File([csv], base + '.csv', { type: 'text/csv' })];
    var titulo = 'Ruta ' + route.numero + ' - ' + fmtFecha(route.fecha);

    function enviar() {
      if (navigator.canShare && navigator.canShare({ files: files }) && navigator.share) {
        navigator.share({ files: files, title: titulo, text: titulo }).catch(function (err) {
          if (err && err.name === 'AbortError') return;
          alert('No se pudo compartir: ' + (err && err.message ? err.message : err));
        });
      } else {
        exportRoutesToCsv([route], 'ruta_' + route.numero);
        alert('Este navegador no permite compartir directo. Se descarg\u00F3 el archivo en Descargas y lo pod\u00E9s enviar desde ah\u00ED.');
      }
    }

    if (!conFotos) { enviar(); return; }

    var items = [];
    for (var i = 0; i < route.calles.length; i++) {
      for (var j = 0; j < route.calles[i].medidores.length; j++) {
        var m = route.calles[i].medidores[j];
        if (m.tieneFoto) items.push({ id: m.id, nombre: pad3(ordenGlobalDe(route, i, j)) + '_' + route.calles[i].nombre.replace(/[^A-Za-z0-9]+/g, '_') + '_med' + m.numMedidor + '.jpg' });
      }
    }
    if (items.length === 0) { alert('Esta ruta todav\u00EDa no tiene fotos. Se comparte solo el Excel.'); enviar(); return; }

    Promise.all(items.map(function (it) {
      return obtenerFoto(it.id).then(function (dataUrl) {
        if (dataUrl) files.push(dataUrlToFile(dataUrl, it.nombre));
      }).catch(function () {});
    })).then(enviar);
  }

  document.getElementById('btnShareExcel').addEventListener('click', function () { compartirRuta(false); });
  document.getElementById('btnShareFotos').addEventListener('click', function () { compartirRuta(true); });

  // ---------- nombre del lecturista ----------
  function mostrarNombre() {
    var n = getLecturista();
    document.getElementById('lecturistaNombre').textContent = n || 'sin nombre';
  }
  function abrirModalNombre(obligatorio) {
    var m = document.getElementById('modalNombre');
    document.getElementById('inpNombre').value = getLecturista();
    document.getElementById('btnNombreCancelar').classList.toggle('hidden', !!obligatorio);
    m.classList.remove('hidden');
    setTimeout(function () { document.getElementById('inpNombre').focus(); }, 150);
  }
  function guardarNombre() {
    var v = document.getElementById('inpNombre').value.trim();
    if (v.length < 3) { alert('Escrib\u00ed tu nombre y apellido.'); return; }
    setLecturista(v);
    document.getElementById('modalNombre').classList.add('hidden');
    mostrarNombre();
    showToast('Nombre guardado \u2713');
  }
  document.getElementById('btnNombreGuardar').addEventListener('click', guardarNombre);
  document.getElementById('inpNombre').addEventListener('keydown', function (e) { if (e.key === 'Enter') guardarNombre(); });
  document.getElementById('btnNombreCancelar').addEventListener('click', function () { document.getElementById('modalNombre').classList.add('hidden'); });
  document.getElementById('btnLecturista').addEventListener('click', function () { abrirModalNombre(false); });
  document.getElementById('verApp').textContent = 'Versi\u00f3n ' + APP_VERSION;
  mostrarNombre();

  // ---------- init ----------
  var session = loadSession();
  if (session && session.routeId && getRoute(session.routeId)) {
    appAbrirRuta(session.routeId);
    if (session.tab === 'recorrido' || session.tab === 'mapa') { setTab(session.tab); renderRoute(); }
  } else {
    renderHome();
  }
  if (!getLecturista()) abrirModalNombre(true);
  startGpsWatch();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
